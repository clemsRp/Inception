
version: '3'

services:
    mariadb:
        container_name: mariadb
        build:
            context: requirements/mariadb
            dockerfile: Dockerfile
        networks:
            - inception
        env_file:
            - .env
        volumes:
            - mariadb:/var/lib/mysql
        restart: unless-stopped
        expose:
            - "3306"

    nginx:
        container_name: nginx
        build:
            context: requirements/nginx
            dockerfile: Dockerfile
        networks:
            - inception
        env_file:
            - .env
        volumes:
            - wordpress:/var/www/wordpress
        restart: on-failure
        depends_on:
            - wordpress
        ports:
            - "443:443"

    wordpress:
        container_name: wordpress
        build:
            context: requirements/wordpress
            dockerfile: Dockerfile
        networks:
            - inception
        env_file:
            - .env
        volumes:
            - wordpress:/var/www/wordpress
        restart: on-failure
        depends_on:
            - mariadb
        expose:
            - "9000"

volumes:
    wordpress:
        driver: local
        driver_opts:
        type: 'none'
        o: 'bind
        device: '/Users/login/data/wordpress'

    mariadb:
        driver: local
        driver_opts:
        type: 'none' 
        o: 'bind'
        device: '/Users/login/data/mariadb'

networks:
		inception:
		driver: bridge
