
services:
    mariadb:
        container_name: mariadb
        image: mariadb
        build:
            context: requirements/mariadb
            dockerfile: Dockerfile
        networks:
            - inception
        env_file:
            - .env
        volumes:
            - mariadb:/var/lib/mysql
        restart: unless-stopped
        expose:
            - "3306"
        secrets:
            - db_password
            - db_root_password

    nginx:
        container_name: nginx
        image: nginx
        build:
            context: requirements/nginx
            dockerfile: Dockerfile
        networks:
            - inception
        env_file:
            - .env
        volumes:
            - wordpress:/var/www/wordpress
        restart: unless-stopped
        depends_on:
            - wordpress
        ports:
            - "443:443"

    wordpress:
        container_name: wordpress
        image: wordpress
        build:
            context: requirements/wordpress
            dockerfile: Dockerfile
        networks:
            - inception
        env_file:
            - .env
        volumes:
            - wordpress:/var/www/wordpress
        restart: unless-stopped
        depends_on:
            - mariadb
        expose:
            - "9000"
        secrets:
            - credentials

volumes:
    wordpress:
        driver: local
        driver_opts:
            type: 'none'
            o: 'bind'
            device: '/Users/crappo/data/wordpress'

    mariadb:
        driver: local
        driver_opts:
            type: 'none' 
            o: 'bind'
            device: '/Users/crappo/data/mariadb'

networks:
    inception:
        driver: bridge

secrets:
    db_password:
        file: ../secrets/db_password.txt

    db_root_password:
        file: ../secrets/db_root_password.txt

    credentials:
        file: ../secrets/credentials.txt
